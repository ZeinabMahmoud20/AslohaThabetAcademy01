services:
  - type: web
    name: payroll-management-system   # اسم الخدمة، غيّريه لأي اسم يعجبك
    runtime: docker                    # يقول لـ Render إن الديبلوي عن طريق Dockerfile
    plan: free                         # يختار الخطة المجانية صراحة
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false                    # sync: false يعني القيمة هتتحط يدوي مرة واحدة من الداشبورد (لأنها سرية)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false 